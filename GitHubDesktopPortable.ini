[GitHubDesktopPortable]
AdditionalParameters=
RunLocally=false
UpdateCheck=true
Architecture=auto

# UpdateCheck=
; Check for a new GitHub Desktop at start and offer to update. On ARM64
; Windows it also offers the ARM64 build when the package doesn't have it.

# Architecture= (auto, x64, arm64)
; Which build to run. auto picks the one that runs natively: ARM64 on
; Windows on ARM when the package has it, x64 everywhere else.

# AdditionalParameters=
; Pass additional command-line switches.

# RunLocally=
; Application is copied to & executed from $TEMP directory.
