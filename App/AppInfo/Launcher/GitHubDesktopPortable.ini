[Launch]
; GitHub Desktop has x64 and ARM64 builds; there is no 32-bit build. The
; launcher runs the ARM64 build on ARM64 Windows when the package has it,
; and the x64 build everywhere else (Windows 11 on ARM runs it emulated).
ProgramExecutable=GitHubDesktop\GitHubDesktop.exe
ProgramExecutableARM64=GitHubDesktopARM64\GitHubDesktop.exe
DirectoryMoveOK=yes
SupportsUNC=no
MinOS=10
; An installed GitHub Desktop that is running would share its data folder
; with this one, so the launch stops when one is open.
SingleAppInstance=true
; A second launch hands its parameters to the running GitHub Desktop, which
; brings its window to the front.
SinglePortableAppInstance=false
RefreshShellIcons=both

[Activate]
Symlinks=true

; GitHub Desktop keeps its settings, repository list and sign-in state in
; %APPDATA%\GitHub Desktop, and clones into Documents\GitHub by default. Both
; are linked into Data while it runs, so nothing is copied back and forth
; and the repositories' paths stay the same from one PC to the next. A real
; folder already in either place (from an installed GitHub Desktop) is
; moved aside for the session and put back afterwards.
[Symlink1]
Type=junction
Source=AppData\GitHub Desktop
Target=%APPDATA%\GitHub Desktop

[Symlink2]
Type=junction
Source=GitHub
Target=%DOCUMENTS%\GitHub

; The global Git settings (user name and email) GitHub Desktop writes are
; kept in Data\.gitconfig. Git reads this variable instead of the user's own
; .gitconfig, so the PC's Git setup is never touched.
[Environment]
GIT_CONFIG_GLOBAL=%PAL:DataDir%\.gitconfig
